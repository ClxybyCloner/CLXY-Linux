name: Build CLXY Linux

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache-dependency-path: core/go.sum

      - name: Core Tests
        working-directory: core
        run: |
          go vet ./...
          go test ./...
          go test -tags with_gvisor ./internal/tunstack/

  build:
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache-dependency-path: core/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Core (${{ matrix.arch }})
        env:
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist/clxy-core-linux-${{ matrix.arch }}
          cd core
          go build -trimpath -ldflags "-s -w" -o ../dist/clxy-core-linux-${{ matrix.arch }}/clxy-core ./cmd/clxy-core
          go build -tags with_gvisor -trimpath -ldflags "-s -w" -o ../dist/clxy-core-linux-${{ matrix.arch }}/clxy-tun ./cmd/clxy-tun
          cp scripts/install-systemd.sh ../dist/clxy-core-linux-${{ matrix.arch }}/
          cp ../LICENSE ../dist/clxy-core-linux-${{ matrix.arch }}/
          cp ../THIRD_PARTY_NOTICES.md ../dist/clxy-core-linux-${{ matrix.arch }}/
          cd ../dist
          tar -czf clxy-core-linux-${{ matrix.arch }}.tar.gz clxy-core-linux-${{ matrix.arch }}

      - name: Package Desktop (${{ matrix.arch }})
        run: |
          mkdir -p dist/clxy-desktop-${{ matrix.arch }}/core dist/clxy-desktop-${{ matrix.arch }}/assets
          cp dist/clxy-core-linux-${{ matrix.arch }}/clxy-core dist/clxy-desktop-${{ matrix.arch }}/core/
          cp dist/clxy-core-linux-${{ matrix.arch }}/clxy-tun dist/clxy-desktop-${{ matrix.arch }}/core/
          cp -r desktop/* dist/clxy-desktop-${{ matrix.arch }}/
          cp LICENSE THIRD_PARTY_NOTICES.md dist/clxy-desktop-${{ matrix.arch }}/
          
          # Create launcher
          cat << 'EOF' > dist/clxy-desktop-${{ matrix.arch }}/clxy
          #!/usr/bin/env bash
          DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export PATH="$DIR/core:$PATH"
          if command -v electron >/dev/null 2>&1; then
            exec electron "$DIR/main.js" "$@"
          else
            "$DIR/core/clxy-core" -tray &
            PID=$!
            sleep 1
            if command -v xdg-open >/dev/null 2>&1; then
              xdg-open "http://127.0.0.1:10820/app/"
            fi
            wait $PID
          fi
          EOF
          chmod +x dist/clxy-desktop-${{ matrix.arch }}/clxy

          cd dist
          tar -czf CLXY-Linux-${{ matrix.arch }}.tar.gz -C dist/clxy-desktop-${{ matrix.arch }} .

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clxy-linux-${{ matrix.arch }}
          path: |
            dist/*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Generate Checksums
        working-directory: dist
        run: sha256sum *.tar.gz > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          name: CLXY Linux Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
